name: CI Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyx'
      - '**.pxd'
      - '**.pyi'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/apt
          build/
        key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libgmp-dev \
          libmpfr-dev \
          gcc \
          g++
    
    - name: Verify dependencies
      run: |
        cmake --version
        gcc --version
        g++ --version
        pkg-config --version
        pkg-config --exists gmp || echo "GMP not found via pkg-config"
        pkg-config --exists mpfr || echo "MPFR not found via pkg-config"
    
    - name: Make test script executable
      run: chmod +x test/run_all_tests.sh
    
    - name: Run all tests
      run: |
        cd test
        ./run_all_tests.sh
    
    - name: Verify test completion
      run: |
        echo "✅ All tests completed successfully!"
        echo "The workflow will only reach this step if run_all_tests.sh exits with code 0"
        echo "and outputs 'All tests passed!'"

  python:
    name: Python Bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev

    - name: Build and install the package
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run the Python test suite
      run: |
        pip install pytest
        pytest test/python -q
