name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev libcurl4-openssl-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DBUILD_TESTS=ON \
          -DBUILD_NL2SMT=ON \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Unified Framework Tests
      run: |
        cd build
        ./test/test_unified_ir
        ./test/test_unified_registry
        ./test/test_smt_to_unified
        ./test/test_mzn_to_unified
        ./test/test_lower_to_smt
        ./test/test_nl_frontend
        ./test/test_context_dispatcher
        ./test/test_benchmark_nl4smt
        ./test/test_ablation_nl4smt

    - name: Test nl2smt CLI (mock mode)
      run: |
        cd build
        echo '{"version":"1","symbols":[{"name":"x","unified_type":"int","is_var":true}],"constraints":[{"op":"gt","args":[{"var":"x"},{"lit":0}]}]}' > /tmp/test_plan.json
        ./nl2smt --mock --plan /tmp/test_plan.json --output /tmp/test_out.smt2
        cat /tmp/test_out.smt2
        grep -q "assert (> x 0)" /tmp/test_out.smt2

    - name: Test nl2smt with solver
      run: |
        cd build
        echo '{"version":"1","symbols":[{"name":"x","unified_type":"int","is_var":true}],"constraints":[{"op":"gt","args":[{"var":"x"},{"lit":0}]}],"objective":{"mode":"minimize","expr":{"var":"x"}}}' > /tmp/test_opt.json
        ./nl2smt --mock --plan /tmp/test_opt.json --solver z3 | grep -q "sat"
