name: CI

on:
  push:
    branches: [main, master, develop, python]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyi'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, develop, python]
    paths:
      - '**.h'
      - '**.hpp'
      - '**.cpp'
      - '**.c'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '**.py'
      - '**.pyi'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  # ==========================================================================
  # C++ Tests (Linux, macOS, Windows)
  # ==========================================================================
  cpp-test:
    name: C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    # ----- Linux dependencies -----
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libgmp-dev libmpfr-dev
    
    # ----- macOS dependencies -----
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake gmp mpfr pkg-config
        echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
    
    # ----- Windows dependencies (vcpkg) -----
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Cache vcpkg packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/packages
        key: vcpkg-x64-windows-gmp-mpfr-v1
        restore-keys: |
          vcpkg-x64-windows-gmp-mpfr-
    
    - name: Install vcpkg dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install gmp:x64-windows mpfr:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
    
    # ----- Build and Test (cross-platform) -----
    - name: Configure CMake
      run: |
        cmake -B build -DBUILD_TESTS=ON ${{ runner.os == 'Windows' && format('-DCMAKE_TOOLCHAIN_FILE={0}', env.CMAKE_TOOLCHAIN_FILE) || '' }}
    
    - name: Build
      run: cmake --build build --config Release --parallel
    
    - name: Run C++ tests (CTest)
      run: ctest --test-dir build --output-on-failure --build-config Release

  # ==========================================================================
  # Python Tests (Linux, macOS, Windows)
  # ==========================================================================
  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.10"
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    # ----- Linux dependencies -----
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev
    
    # ----- macOS dependencies -----
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gmp mpfr pkg-config
        echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
        echo "CPATH=$(brew --prefix)/include:$CPATH" >> $GITHUB_ENV
    
    # ----- Windows dependencies (vcpkg) -----
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Cache vcpkg packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/packages
        key: vcpkg-x64-windows-gmp-mpfr-v1
        restore-keys: |
          vcpkg-x64-windows-gmp-mpfr-
    
    - name: Install vcpkg dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install gmp:x64-windows mpfr:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
    
    # ----- Python setup -----
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    
    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
    
    # ----- Build and Test -----
    - name: Build and install Python package
      run: pip install -v ".[test]"
      env:
        CMAKE_TOOLCHAIN_FILE: ${{ env.CMAKE_TOOLCHAIN_FILE }}
    
    - name: Test import
      run: python -c "import somtparser; print(f'somtparser {somtparser.__version__}')"
    
    - name: Run Python tests
      run: pytest -v test/python/
