name: Python

on:
  push:
    branches: [main, master, python]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.10"

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev
    
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gmp mpfr pkg-config
        echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
        echo "CPATH=$(brew --prefix)/include:$CPATH" >> $GITHUB_ENV
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    
    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
    
    - name: Build and install
      run: |
        pip install -v ".[test]"
    
    - name: Test import
      run: |
        python -c "import somtparser; print(somtparser.__version__)"
    
    - name: Run tests
      run: |
        pytest -v test/python/

  # Windows build (separate job due to different dependency setup)
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Install vcpkg dependencies
      run: |
        vcpkg install gmp:x64-windows mpfr:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
    
    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
    
    - name: Build and install
      run: |
        pip install -v ".[test]"
      env:
        CMAKE_TOOLCHAIN_FILE: ${{ env.CMAKE_TOOLCHAIN_FILE }}
    
    - name: Test import
      run: |
        python -c "import somtparser; print(somtparser.__version__)"
    
    - name: Run tests
      run: |
        pytest -v test/python/
